name: Catalog Sync

on:
  schedule:
    # Full sync: every Sunday at 2 AM UTC
    - cron: "0 2 * * 0"
    # Delta sync: every 6 hours (Mon-Sat)
    - cron: "0 */6 * * 1-6"
  workflow_dispatch:
    inputs:
      mode:
        description: "Sync mode"
        required: true
        default: "delta"
        type: choice
        options: [delta, full]
      dry_run:
        description: "Dry run (no DB writes)"
        required: false
        default: "false"
        type: boolean

jobs:
  catalog-sync:
    name: Catalog Sync (${{ github.event.inputs.mode || 'scheduled' }})
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v3
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm db:generate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}

      - name: Run catalog sync
        run: |
          MODE="${{ github.event.inputs.mode || 'delta' }}"
          DRY_RUN="${{ github.event.inputs.dry_run || 'false' }}"
          ARGS="--$MODE"
          if [ "$DRY_RUN" = "true" ]; then
            ARGS="$ARGS --dry-run"
          fi
          # Full sync on Sunday, delta otherwise
          if [ "$(date +%u)" = "7" ] && [ -z "${{ github.event.inputs.mode }}" ]; then
            ARGS="--full"
          fi
          pnpm --filter @rr/catalog-sync start $ARGS
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
          KEYSTONE_API_KEY: ${{ secrets.KEYSTONE_API_KEY }}
          KEYSTONE_ACCOUNT_NUMBER: ${{ secrets.KEYSTONE_ACCOUNT_NUMBER }}
          KEYSTONE_FTP_HOST: ${{ secrets.KEYSTONE_FTP_HOST }}
          KEYSTONE_FTP_USER: ${{ secrets.KEYSTONE_FTP_USER }}
          KEYSTONE_FTP_PASS: ${{ secrets.KEYSTONE_FTP_PASS }}
          TURN14_API_KEY: ${{ secrets.TURN14_API_KEY }}
          TURN14_API_BASE_URL: ${{ secrets.TURN14_API_BASE_URL }}
          MEYER_FTP_HOST: ${{ secrets.MEYER_FTP_HOST }}
          MEYER_FTP_USER: ${{ secrets.MEYER_FTP_USER }}
          MEYER_FTP_PASS: ${{ secrets.MEYER_FTP_PASS }}
          SHOPIFY_STORE_DOMAIN: ${{ secrets.SHOPIFY_STORE_DOMAIN }}
          SHOPIFY_ADMIN_API_KEY: ${{ secrets.SHOPIFY_ADMIN_API_KEY }}
          SHOPIFY_ADMIN_API_SECRET: ${{ secrets.SHOPIFY_ADMIN_API_SECRET }}
